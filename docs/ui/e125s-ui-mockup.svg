<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#071018"/>
      <stop offset="1" stop-color="#0e1720"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1">
      <stop offset="0" stop-color="#51e26f"/>
      <stop offset="1" stop-color="#8af48e"/>
    </linearGradient>
    <style>
      .phone{fill:#05080b;stroke:#202b34;stroke-width:10}
      .screen{fill:url(#bg);stroke:#24323c;stroke-width:2}
      .card{fill:#14202a;stroke:#2b3944;stroke-width:2}
      .card2{fill:#101a22;stroke:#26333c;stroke-width:2}
      .good{fill:#0e3a26;stroke:#22c55e;stroke-width:2}
      .warn{fill:#33270e;stroke:#f59e0b;stroke-width:2}
      .txt{fill:#f7fafc;font-family:Inter,Arial,sans-serif}
      .muted{fill:#9fb0bc;font-family:Inter,Arial,sans-serif}
      .green{fill:#67ee7c;font-family:Inter,Arial,sans-serif}
      .blue{fill:#58b8ff;font-family:Inter,Arial,sans-serif}
      .amber{fill:#ffc34d;font-family:Inter,Arial,sans-serif}
      .h1{font-size:28px;font-weight:800}
      .h2{font-size:20px;font-weight:800}
      .body{font-size:15px}
      .small{font-size:12px}
      .metric{font-size:34px;font-weight:800}
      .btn{fill:url(#green);stroke:#9affaa;stroke-width:1}
      .slider{stroke:#42515d;stroke-width:12;stroke-linecap:round}
      .active{stroke:#56e977;stroke-width:12;stroke-linecap:round}
      .cyan{stroke:#58b8ff;stroke-width:12;stroke-linecap:round}
    </style>
  </defs>

  <rect width="1536" height="1024" fill="#05090d"/>

  <!-- Screen 1 -->
  <rect x="18" y="14" rx="62" ry="62" width="480" height="996" class="phone"/>
  <rect x="34" y="30" rx="48" ry="48" width="448" height="964" class="screen"/>
