  <text x="66" y="104" class="muted body">FarDriver 72210</text>
  <rect x="300" y="56" rx="18" width="142" height="42" class="good"/>
  <text x="335" y="83" class="green body">● Connected</text>

  <rect x="54" y="126" rx="24" width="408" height="108" class="card"/>
