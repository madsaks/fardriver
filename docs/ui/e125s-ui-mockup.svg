  <circle cx="584" cy="908" r="20" fill="#6b7b88"/><text x="578" y="915" class="txt body">6</text><text x="620" y="915" class="txt h2">Speed Display Calibration</text>
  <circle cx="584" cy="966" r="20" fill="#6b7b88"/><text x="578" y="973" class="txt body">7</text><text x="620" y="973" class="txt h2">Apply &amp; Save</text>

  <!-- Screen 3 -->
  <rect x="1038" y="14" rx="62" ry="62" width="480" height="996" class="phone"/>
