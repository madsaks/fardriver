  <rect x="1288" y="132" rx="28" width="190" height="176" class="card"/>
  <text x="1320" y="208" class="metric amber">4200</text><text x="1351" y="235" class="txt body">motor RPM</text><text x="1320" y="272" class="muted small">≈ 1050 wheel RPM</text>

  <rect x="1080" y="330" rx="20" width="122" height="96" class="card2"/><text x="1100" y="360" class="muted small">Voltage</text><text x="1100" y="399" class="txt h2">50.8 V</text>
  <rect x="1218" y="330" rx="20" width="122" height="96" class="card2"/><text x="1238" y="360" class="muted small">Line Current</text><text x="1238" y="399" class="txt h2">43.2 A</text>
  <rect x="1356" y="330" rx="20" width="122" height="96" class="card2"/><text x="1376" y="360" class="muted small">Power</text><text x="1376" y="399" class="txt h2">2.2 kW</text>

  <rect x="1080" y="442" rx="20" width="122" height="96" class="card2"/><text x="1100" y="472" class="muted small">Motor Temp</text><text x="1100" y="511" class="txt h2">32°C</text>
  <rect x="1218" y="442" rx="20" width="122" height="96" class="card2"/><text x="1238" y="472" class="muted small">MOS Temp</text><text x="1238" y="511" class="txt h2">28°C</text>
  <rect x="1356" y="442" rx="20" width="122" height="96" class="card2"/><text x="1376" y="472" class="muted small">Phase Current</text><text x="1376" y="511" class="txt h2">118 A</text>

  <rect x="1080" y="554" rx="20" width="122" height="96" class="card2"/><text x="1100" y="584" class="muted small">Mode / Gear</text><text x="1100" y="623" class="txt h2">3 Sport</text>
  <rect x="1218" y="554" rx="20" width="122" height="96" class="card2"/><text x="1238" y="584" class="muted small">Throttle</text><text x="1238" y="623" class="txt h2">78%</text>
  <rect x="1356" y="554" rx="20" width="122" height="96" class="good"/><text x="1376" y="584" class="muted small">Status</text><text x="1376" y="623" class="green h2">System OK</text>

  <rect x="1080" y="678" rx="18" width="398" height="48" class="card2"/>
  <rect x="1088" y="686" rx="14" width="94" height="32" fill="#75ec70"/><text x="1112" y="708" fill="#07130a" font-family="Inter,Arial" font-size="13" font-weight="800">Tuning</text>
  <text x="1220" y="708" class="muted body">Properties</text><text x="1332" y="708" class="muted body">Faults</text><text x="1408" y="708" class="muted body">Logs</text>

  <rect x="1080" y="744" rx="22" width="398" height="202" class="card"/>
  <text x="1105" y="780" class="amber h2">⚡ Power Limits</text><text x="1340" y="780" class="muted small">Rated 60 A · Max 70 A</text>
  <line x1="1108" y1="826" x2="1450" y2="826" class="slider"/><line x1="1108" y1="826" x2="1378" y2="826" class="active"/><circle cx="1378" cy="826" r="15" fill="#f5f7f8"/>
  <text x="1108" y="862" class="txt h2">Acceleration</text><text x="1407" y="862" class="txt h2">70%</text>
  <line x1="1108" y1="900" x2="1450" y2="900" class="slider"/><line x1="1108" y1="900" x2="1368" y2="900" class="active"/><circle cx="1368" cy="900" r="15" fill="#f5f7f8"/>
  <text x="1108" y="934" class="muted small">Speed target remains preview-only pending calibration</text>
