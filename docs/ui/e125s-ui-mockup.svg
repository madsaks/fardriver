  <text x="82" y="190" class="muted body">48 V · Dual 30 Ah · Stock QS hub</text>
  <text x="82" y="214" class="muted body">120/70-12 · FarDriver 72210</text>

  <rect x="54" y="254" rx="22" width="124" height="102" class="card2"/>
  <rect x="187" y="254" rx="22" width="142" height="102" fill="#72ea83"/>
  <rect x="338" y="254" rx="22" width="124" height="102" class="card2"/>
  <text x="88" y="296" class="txt h2">Range</text>
  <text x="231" y="296" fill="#08120b" font-family="Inter,Arial" font-size="20" font-weight="800">Daily</text>
