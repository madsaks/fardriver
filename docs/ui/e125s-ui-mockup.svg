  <text x="642" y="552" class="muted small">Controller</text><text x="760" y="552" class="txt body">FarDriver 72210</text>

  <circle cx="584" cy="626" r="20" fill="#6b7b88"/><text x="578" y="633" class="txt body">4</text>
